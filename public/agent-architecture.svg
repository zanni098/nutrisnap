<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Geist, Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#052e16" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="80" y="86" font-size="44" font-weight="800" fill="#052e16">NutriSnap Wellness Agent</text>
  <text x="80" y="124" font-size="24" font-weight="600" fill="#16a34a">Proactive Wellness Critic · ReAct loop over a NutriSnap tool registry</text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="80" y="200" width="250" height="200" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <text x="205" y="250" font-size="22" font-weight="700" fill="#052e16" text-anchor="middle">Goal / Meal</text>
  <text x="205" y="290" font-size="16" fill="#475569" text-anchor="middle">"Review my week"</text>
  <text x="205" y="316" font-size="16" fill="#475569" text-anchor="middle">or a new meal photo</text>
  <text x="205" y="360" font-size="15" fill="#94a3b8" text-anchor="middle">+ long-term profile</text>
  <text x="205" y="382" font-size="15" fill="#94a3b8" text-anchor="middle">(no re-input)</text>

  <!-- LLM + ReAct core -->
  <g filter="url(#shadow)">
    <rect x="440" y="170" width="360" height="260" rx="22" fill="#052e16"/>
  </g>
  <text x="620" y="222" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">LLM Agent Core</text>
  <text x="620" y="252" font-size="16" fill="#86efac" text-anchor="middle">Gemini (live) · deterministic mock</text>
  <rect x="480" y="278" width="280" height="120" rx="14" fill="#14532d"/>
  <text x="620" y="312" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">ReAct loop</text>
  <text x="620" y="344" font-size="16" fill="#bbf7d0" text-anchor="middle">Reason → Act → Observe</text>
  <text x="620" y="372" font-size="14" fill="#86efac" text-anchor="middle">persona: evidence-first, blunt</text>

  <!-- Guardrails wrapper -->
  <rect x="900" y="150" width="620" height="470" rx="24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="920" y="180" font-size="17" font-weight="700" fill="#b45309">Guardrails: input · output clamp · tool whitelist · loop budget</text>

  <!-- Tool registry -->
  <g filter="url(#shadow)">
    <rect x="930" y="205" width="560" height="300" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <text x="1210" y="242" font-size="22" font-weight="800" fill="#052e16" text-anchor="middle">Tool Registry</text>
  <text x="1210" y="266" font-size="14" fill="#64748b" text-anchor="middle">wraps NutriSnap features · also an MCP server</text>

  <g font-size="17" font-weight="600" fill="#065f46">
    <rect x="958" y="288" width="504" height="34" rx="9" fill="#f0fdf4"/><text x="974" y="311">parse_food_image()</text>
    <rect x="958" y="330" width="504" height="34" rx="9" fill="#f0fdf4"/><text x="974" y="353">fetch_logged_macros()</text>
    <rect x="958" y="372" width="504" height="34" rx="9" fill="#f0fdf4"/><text x="974" y="395">calculate_trajectory()</text>
    <rect x="958" y="414" width="504" height="34" rx="9" fill="#f0fdf4"/><text x="974" y="437">generate_wellness_plan()</text>
    <rect x="958" y="456" width="504" height="34" rx="9" fill="#f0fdf4"/><text x="974" y="479">log_meal()</text>
  </g>

  <!-- Memory -->
  <g filter="url(#shadow)">
    <rect x="440" y="470" width="360" height="150" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <text x="620" y="508" font-size="20" font-weight="700" fill="#052e16" text-anchor="middle">Memory</text>
  <text x="620" y="540" font-size="15" fill="#475569" text-anchor="middle">short-term: ReAct scratchpad</text>
  <text x="620" y="566" font-size="15" fill="#475569" text-anchor="middle">long-term: trends · prefs · past verdicts</text>
  <text x="620" y="596" font-size="13" fill="#94a3b8" text-anchor="middle">persists across sessions</text>

  <!-- Output -->
  <g filter="url(#shadow)">
    <rect x="80" y="470" width="250" height="150" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <text x="205" y="506" font-size="19" font-weight="700" fill="#052e16" text-anchor="middle">Structured</text>
  <text x="205" y="530" font-size="19" font-weight="700" fill="#052e16" text-anchor="middle">Intervention</text>
  <g text-anchor="middle" font-size="13" font-weight="700">
    <rect x="100" y="548" width="94" height="26" rx="13" fill="#dcfce7"/><text x="147" y="566" fill="#15803d">APPROVE</text>
    <rect x="200" y="548" width="70" height="26" rx="13" fill="#fef3c7"/><text x="235" y="566" fill="#b45309">WARN</text>
    <rect x="100" y="582" width="70" height="26" rx="13" fill="#fee2e2"/><text x="135" y="600" fill="#b91c1c">BLOCK</text>
    <rect x="176" y="582" width="132" height="26" rx="13" fill="#dbeafe"/><text x="242" y="600" fill="#1d4ed8">PROACTIVE PLAN</text>
  </g>

  <!-- Arrows -->
  <g stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M330 300 H440"/>
    <path d="M800 300 H930"/>
    <path d="M930 360 Q860 400 800 360" stroke="#94a3b8"/>
    <path d="M620 430 V470"/>
    <path d="M440 545 H330"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="865" y="345" font-size="13" fill="#94a3b8" text-anchor="middle">observe</text>

  <!-- Footer concept chips -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="80" y="700" width="200" height="40" rx="20" fill="#052e16"/><text x="180" y="726" fill="#fff">Agent / ReAct</text>
    <rect x="296" y="700" width="150" height="40" rx="20" fill="#052e16"/><text x="371" y="726" fill="#fff">MCP Server</text>
    <rect x="462" y="700" width="180" height="40" rx="20" fill="#052e16"/><text x="552" y="726" fill="#fff">Guardrails</text>
    <rect x="658" y="700" width="150" height="40" rx="20" fill="#052e16"/><text x="733" y="726" fill="#fff">Memory</text>
    <rect x="824" y="700" width="190" height="40" rx="20" fill="#052e16"/><text x="919" y="726" fill="#fff">Agent skills</text>
    <rect x="1030" y="700" width="180" height="40" rx="20" fill="#052e16"/><text x="1120" y="726" fill="#fff">Deployable</text>
  </g>
  <text x="80" y="792" font-size="15" fill="#94a3b8">Google × Kaggle · AI Agents Vibe Coding Capstone · Track: Agents for Good</text>
</svg>
