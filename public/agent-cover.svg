<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Geist, Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="cshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#cbg)"/>
  <!-- subtle grid dots -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="1250" cy="140" r="120"/>
    <circle cx="1480" cy="640" r="200"/>
  </g>

  <!-- Badge -->
  <rect x="110" y="120" width="430" height="46" rx="23" fill="#ffffff" opacity="0.12"/>
  <text x="134" y="150" font-size="20" font-weight="700" fill="#bbf7d0">Google × Kaggle · Vibe Coding Capstone</text>

  <!-- Emoji mark -->
  <text x="110" y="330" font-size="110">🥗🤖</text>

  <!-- Headline -->
  <text x="110" y="440" font-size="92" font-weight="800" fill="#ffffff">NutriSnap</text>
  <text x="110" y="530" font-size="58" font-weight="800" fill="#86efac">Wellness Agent</text>

  <text x="114" y="600" font-size="30" font-weight="600" fill="#e2e8f0">A photo calorie tracker that stopped being passive —</text>
  <text x="114" y="642" font-size="30" font-weight="600" fill="#e2e8f0">an autonomous <tspan fill="#ffffff" font-weight="800">Proactive Wellness Critic</tspan> that acts for you.</text>

  <!-- Verdict chips -->
  <g font-size="24" font-weight="800" text-anchor="middle">
    <rect x="114" y="700" width="150" height="52" rx="26" fill="#dcfce7"/><text x="189" y="734" fill="#15803d">APPROVE</text>
    <rect x="280" y="700" width="120" height="52" rx="26" fill="#fef3c7"/><text x="340" y="734" fill="#b45309">WARN</text>
    <rect x="416" y="700" width="120" height="52" rx="26" fill="#fee2e2"/><text x="476" y="734" fill="#b91c1c">BLOCK</text>
    <rect x="552" y="700" width="230" height="52" rx="26" fill="#dbeafe"/><text x="667" y="734" fill="#1d4ed8">PROACTIVE PLAN</text>
  </g>

  <!-- Right: mock intervention card -->
  <g filter="url(#cshadow)">
    <rect x="1030" y="250" width="470" height="420" rx="28" fill="#ffffff"/>
  </g>
  <rect x="1066" y="286" width="120" height="40" rx="20" fill="#fee2e2"/>
  <text x="1126" y="313" font-size="20" font-weight="800" fill="#b91c1c" text-anchor="middle">BLOCK</text>
  <text x="1066" y="372" font-size="22" font-weight="700" fill="#0f172a">Cheeseburger withheld.</text>
  <text x="1066" y="408" font-size="17" fill="#475569">7-day audit: protein −82g/day vs goal;</text>
  <text x="1066" y="432" font-size="17" fill="#475569">quality declining 5.8 → 3.3.</text>
  <text x="1066" y="478" font-size="16" font-weight="700" fill="#065f46">Corrective actions</text>
  <text x="1066" y="506" font-size="15" fill="#334155">• +82g protein/day, front-loaded</text>
  <text x="1066" y="530" font-size="15" fill="#334155">• plan dinners 3 days ahead</text>
  <text x="1066" y="576" font-size="16" font-weight="700" fill="#065f46">Grocery list</text>
  <g font-size="13" font-weight="600" fill="#15803d">
    <rect x="1066" y="592" width="120" height="28" rx="14" fill="#dcfce7"/><text x="1126" y="611" text-anchor="middle">Greek yogurt</text>
    <rect x="1196" y="592" width="120" height="28" rx="14" fill="#dcfce7"/><text x="1256" y="611" text-anchor="middle">chicken breast</text>
    <rect x="1326" y="592" width="80" height="28" rx="14" fill="#dcfce7"/><text x="1366" y="611" text-anchor="middle">lentils</text>
    <rect x="1066" y="628" width="70" height="28" rx="14" fill="#dcfce7"/><text x="1101" y="647" text-anchor="middle">eggs</text>
    <rect x="1146" y="628" width="90" height="28" rx="14" fill="#dcfce7"/><text x="1191" y="647" text-anchor="middle">spinach</text>
  </g>

  <text x="110" y="822" font-size="20" font-weight="600" fill="#bbf7d0">ReAct loop · Tool registry · MCP server · Guardrails · Memory · Deployed on Vercel</text>
</svg>
