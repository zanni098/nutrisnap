<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="Geist, Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1" stop-color="#16a34a"/>
